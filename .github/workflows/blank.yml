name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract Flutter project
        run: |
          unzip -q necner_merchant_app_V26_UPDATED.zip -d flutter_project

      - name: Find Flutter project
        run: |
          echo "Searching for Flutter project..."

          PROJECT_DIR=$(find flutter_project -type f -name "pubspec.yaml" -print -quit | xargs -r dirname)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."
            echo "ZIP contents:"
            find flutter_project -maxdepth 4 -type f | head -200
            exit 1
          fi

          echo "Flutter project found at:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter Doctor
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter doctor -v

      - name: Get Flutter packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter pub get

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: necner-merchant-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
