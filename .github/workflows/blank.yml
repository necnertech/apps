name: Build Flutter APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Find uploaded ZIP
        run: |
          echo "Files in repository:"
          ls -lah

          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" -print -quit)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found in repository."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          echo "ZIP_FILE=$ZIP_FILE" >> "$GITHUB_ENV"

      - name: Extract Flutter project
        run: |
          rm -rf flutter_project
          mkdir -p flutter_project

          unzip -q "$ZIP_FILE" -d flutter_project

      - name: Find Flutter project
        run: |
          echo "Searching for pubspec.yaml..."

          PROJECT_DIR=$(find flutter_project -type f -name "pubspec.yaml" -print -quit)

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: pubspec.yaml not found."

            echo "ZIP contents:"
            find flutter_project -maxdepth 6 -type f | head -300

            exit 1
          fi

          PROJECT_DIR=$(dirname "$PROJECT_DIR")

          echo "Flutter project found:"
          echo "$PROJECT_DIR"

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Prepare Android project
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          rm -f android/local.properties
          flutter clean || true

      - name: Flutter Doctor
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter doctor -v

      - name: Get Flutter packages
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter pub get

      - name: Check Dart code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          dart analyze --no-fatal-infos

      - name: Build Release APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          flutter build apk --release --android-skip-build-dependency-validation

      - name: Verify APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          test -f build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: necner-merchant-release-apk
          path: ${{ env.PROJECT_DIR }}/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
